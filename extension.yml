schema_version: "1.0"

extension:
  id: "cbt"
  name: "CBT Thought Record"
  version: "1.0.0"
  description: "Guided Cognitive Behavioral Therapy thought records with 12-step structured flow, daily check-ins, and pattern analysis"
  author: "arktnld"
  repository: "https://github.com/arktnld/cbt-llm-kit"
  license: "MIT"
  homepage: "https://github.com/arktnld/cbt-llm-kit"

requires:
  speckit_version: ">=0.1.0"

provides:
  commands:
    - name: "speckit.cbt.record"
      file: "commands/record.md"
      description: "Create a new CBT thought record using the 12-step structured flow"
      aliases: ["cbt.record"]

    - name: "speckit.cbt.checkin"
      file: "commands/checkin.md"
      description: "Daily reflection on today's thought records"
      aliases: ["cbt.checkin"]

    - name: "speckit.cbt.analyze"
      file: "commands/analyze.md"
      description: "Analyze patterns across all thought records over time"
      aliases: ["cbt.analyze"]

  config:
    - name: "cbt-config.yml"
      template: "cbt-config-template.yml"
      description: "CBT extension configuration"
      required: false

tags:
  - "wellness"
  - "mental-health"
  - "cbt"

defaults:
  language: "en"
  records_path: "records/"
